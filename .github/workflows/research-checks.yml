name: Research branch checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [research/constraint-aware-rag-rework]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/research_test
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      ADMIN_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
